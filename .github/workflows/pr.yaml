name: Test Docker Build

on:
  pull_request:
    branches:
      - 'paper'
      - 'fabric'
      - 'mc/*/*'

jobs:
  pr-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build Paper
        uses: docker/build-push-action@v6
        with:
          push: false
          file: ./Dockerfile
