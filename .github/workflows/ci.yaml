name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Find targets to build
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request) base=${PR_BASE} ;;
            push) base=$(gh run list --workflow ci.yaml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""') ;;
            *) base="" ;;
          esac
          echo "targets=$(.github/scripts/changed-targets.sh "${base}")" >> "${GITHUB_OUTPUT}"

  build:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          targets: ${{ matrix.target }}
          load: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json
      - name: Install client test dependencies
        run: npm ci --prefix .github/scripts
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: .github/scripts/smoke-test.sh "$(docker buildx bake --progress=quiet --print "${TARGET}" | jq -r '.target[].tags[0]')"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          targets: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true

  readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AUTO_COMMIT_APP_ID: ${{ vars.AUTO_COMMIT_APP_ID }}
    steps:
      - name: Generate GitHub App Token
        if: env.AUTO_COMMIT_APP_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - name: Name the committer
        if: steps.app-token.outputs.token != ''
        id: committer
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          name="${SLUG}[bot]"
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          {
            echo "name=${name}"
            echo "email=${id}+${name}@users.noreply.github.com"
          } >> "${GITHUB_OUTPUT}"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Update version tables
        run: .github/scripts/versions.sh README.md
      - name: Commit
        if: steps.app-token.outputs.token != ''
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          file_pattern: README.md
          commit_message: 'docs: update version tables'
          commit_user_name: ${{ steps.committer.outputs.name }}
          commit_user_email: ${{ steps.committer.outputs.email }}
          commit_author: ${{ steps.committer.outputs.name }} <${{ steps.committer.outputs.email }}>
      - name: Check version tables
        if: steps.app-token.outputs.token == ''
        run: git diff --exit-code README.md || { echo "::error::README.md is out of date, run .github/scripts/versions.sh"; exit 1; }

  docker:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          [ "${PLAN}" = success ] && { [ "${BUILD}" = success ] || [ "${BUILD}" = skipped ]; }
